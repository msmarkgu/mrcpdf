# Continuous integration for mrcpdf.
#
# The suite generates its own PDF fixtures (the `test` task dependsOn
# `generateTestPdfs`), so this only needs a JDK and Gradle.
#
# jbig2enc is installed deliberately. Without it the batch JBIG2 tests report
# as *skipped* rather than passing -- that is the fix in 990ffab, which ended
# a situation where a broken symbol-dictionary path showed up green. Installing
# it here means the shared-dictionary path is actually exercised on every run
# instead of being quietly absent.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The project pins Gradle 8.0.1 to match the local distribution that
      # bootstrap.sh installs; the wrapper jar is gitignored, so invoke the
      # `gradle` binary from the runner rather than ./gradlew.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0.1'

      - name: Install jbig2enc
        run: |
          sudo apt-get update
          sudo apt-get install -y jbig2enc
          jbig2enc --version || true

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Test
        run: gradle test --console=plain

      - name: Verify jbig2enc tests were not skipped
        # If jbig2enc failed to install above, the batch tests would skip and
        # this run would look green while covering less. Fail loudly instead.
        # JUnit XML records this as skipped="N", so match a non-zero count only.
        run: |
          if grep -Eq 'skipped="[1-9]' build/test-results/test/*.xml 2>/dev/null; then
            echo "::error::tests were skipped -- jbig2enc is probably unavailable,"
            echo "::error::so the shared-symbol-dictionary path went untested"
            grep -ho 'skipped="[0-9]*"' build/test-results/test/*.xml | sort | uniq -c
            exit 1
          fi
          echo "no skipped tests"

      - name: Build fat jar
        run: gradle shadowJar --console=plain

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: mrcpdf-jar
          path: build/mrcpdf.jar
          if-no-files-found: error